name: CI

# 在 push / PR 到 main 时跑: Rust fmt + clippy + 单测(全部硬门槛) + 前端构建。
# 游戏平台精简后:只剩桌面壳单包(polaris-app),Polaris 的 server/Forge/sandbox 路径已下线,
# 对应的 forge-matrix / forge-e2e / polaris-cli 三个 CI job 一并移除。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (test + clippy)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # tauri::generate_context! 在编译期要求 frontendDist(../dist)存在,否则 proc macro panic。
      # 后端单测不需要真前端,放个 stub index.html 满足它即可(真前端由 frontend job 验)。
      - name: Stub frontend dist (满足 tauri generate_context!)
        shell: bash
        run: mkdir -p ../dist && echo '<!doctype html><title>stub</title>' > ../dist/index.html
      # 硬门槛: 格式必须规整 (存量已清零, 见 2026-07 收紧)
      - name: Format check
        run: cargo fmt --all --check
      # 硬门槛: clippy 零告警 (-D warnings, 存量已清零)
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # 硬门槛: 单测必须过 (含 kb 路径穿越 / codex_proxy 解析边界等回归测试)
      - name: Test
        run: cargo test --workspace

  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # npm run build = vue-tsc --noEmit && vite build (类型检查 + 打包)
      - run: npm run build
      - run: npm run check:contract
      - run: npm run audit:prod
