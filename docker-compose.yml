# 尘世浮生 · Docker 部署
#   cp .env.example .env && 编辑填好密钥
#   docker compose up -d --build
services:
  chenshi:
    build:
      context: .
      args:
        # 构建期注入前端默认生图 key（可留空，改用下面的 IMAGE_API_KEY 服务端注入）
        VITE_STEPFUN_API_KEY: ${VITE_STEPFUN_API_KEY:-}
    image: chenshi-fushenglu:latest
    container_name: chenshi
    ports:
      - "8080:8080"
    environment:
      # LLM（三选一：官方 key，或兼容端点 BASE_URL+AUTH_TOKEN）
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      # 访问口令（公网部署务必设置）
      POLARIS_AUTH_TOKEN: ${POLARIS_AUTH_TOKEN:-}
      # 生图代理兜底 key（服务端注入，不下发浏览器）
      IMAGE_API_KEY: ${IMAGE_API_KEY:-}
      POLARIS_CHAT_TIMEOUT_SECS: ${POLARIS_CHAT_TIMEOUT_SECS:-300}
    restart: unless-stopped
    # 容器只读根文件系统 + 常规硬化
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
