[package]
name = "chenshi-desktop"
version = "0.11.0"
edition = "2021"
description = "尘世浮生 桌面壳"

# 刻意不加入 backend 的 workspace：Tauri 需要 GUI 系统依赖
# （Linux: webkit2gtk-4.1 / libayatana-appindicator3），
# 无头 CI 与 WSL 里装不了。守护逻辑已抽到 backend/sidecar，那里能真跑测试。
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sidecar = { path = "../../../../backend/sidecar" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
