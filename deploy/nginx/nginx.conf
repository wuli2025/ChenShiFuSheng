worker_processes auto;
events { worker_connections 4096; }

http {
  include       /etc/nginx/mime.types;
  sendfile      on;
  tcp_nopush    on;
  gzip          on;
  gzip_types    text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # 限流：写接口比读接口严得多
  limit_req_zone $binary_remote_addr zone=api_read:10m  rate=30r/s;
  limit_req_zone $binary_remote_addr zone=api_write:10m rate=2r/s;

  upstream api_pool { server api:8080; keepalive 32; }

  server {
    listen 80;
    client_max_body_size 32m;

    # —— 产物仓静态直出。玩家读流量在此终结，不打 API。
    location /games/ {
      alias /srv/data/builds/;
      add_header Cache-Control "public, max-age=31536000, immutable";
      etag on;
    }

    # —— SSE：不能缓冲，不能超时
    location ~ ^/v1/projects/[^/]+/events$ {
      proxy_pass http://api_pool;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 24h;
    }

    location /v1/ {
      limit_req zone=api_read burst=60 nodelay;
      proxy_pass http://api_pool;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # 写接口单独限流
    location ~ ^/v1/(projects|templates/extract)$ {
      limit_req zone=api_write burst=5 nodelay;
      proxy_pass http://api_pool;
    }

    # —— 前端 SPA
    location / {
      root /srv/web;
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "public, max-age=300";
    }
  }
}
