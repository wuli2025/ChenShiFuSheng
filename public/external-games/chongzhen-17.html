<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>重生·崇祯十七年 — 你能救得了大明吗</title>
<style>
  :root{
    --ink:#2c4661; --ink-soft:#3d5b78; --ink-deep:#1f2d3a;
    --paper:#f4f1ea; --paper-2:#ebebe8; --paper-3:#e3ddcf;
    --line:#c9c2b4; --cinnabar:#a8443a; --gold:#9c7a3c;
    --text:#27313a; --muted:#6b7480; --good:#3d6b54;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"PingFang SC","Microsoft YaHei","Songti SC",serif;
    background:var(--paper); color:var(--text); line-height:1.85;
    background-image:radial-gradient(circle at 20% 0%,rgba(44,70,97,.04),transparent 40%),
                     radial-gradient(circle at 90% 100%,rgba(156,122,60,.05),transparent 45%);}
  .wrap{max-width:960px;margin:0 auto;padding:28px 20px 80px;min-height:100%}

  /* ====== 标题 ====== */
  header.hero{border:1px solid var(--line);
    background:linear-gradient(180deg,#fbfaf6,#ece7db);
    border-radius:14px;padding:30px 36px;margin-bottom:22px;position:relative;overflow:hidden}
  header.hero::after{content:"明";position:absolute;right:26px;top:-18px;
    font-size:150px;color:rgba(44,70,97,.05);font-weight:700;font-family:"Songti SC",serif}
  .tag{display:inline-block;font-size:12px;letter-spacing:3px;color:var(--cinnabar);
    border:1px solid var(--cinnabar);border-radius:20px;padding:2px 14px;margin-bottom:12px}
  h1{font-size:30px;color:var(--ink);letter-spacing:3px;font-weight:700}
  .sub{color:var(--muted);margin-top:8px;font-size:14px;letter-spacing:.5px}

  /* ====== 状态条 ====== */
  .hud{position:sticky;top:0;z-index:20;background:rgba(244,241,234,.94);
    backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:12px;
    padding:12px 16px;margin-bottom:18px;display:none}
  .hud.show{display:block}
  .hud-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px}
  .hud-yr{color:var(--ink);font-weight:700;font-size:15px;letter-spacing:1px}
  .hud-yr small{color:var(--muted);font-weight:400;font-size:12px;margin-left:8px;letter-spacing:0}
  .stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
  @media(max-width:680px){.stats{grid-template-columns:repeat(3,1fr)}}
  .stat{font-size:11px}
  .stat .lb{display:flex;justify-content:space-between;color:var(--muted);margin-bottom:3px}
  .stat .lb b{color:var(--ink);font-weight:600}
  .bar{height:6px;background:var(--paper-3);border-radius:4px;overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ink-soft),var(--ink));
    border-radius:4px;transition:width .6s ease,background .4s}
  .bar.low i{background:linear-gradient(90deg,#c46a5f,var(--cinnabar))}
  .bar.hi i{background:linear-gradient(90deg,#4f8a6c,var(--good))}

  /* ====== 主舞台 ====== */
  .stage{border:1px solid var(--line);background:#fbfaf6;border-radius:14px;
    padding:30px 34px;margin-bottom:18px;position:relative;
    box-shadow:0 1px 0 rgba(255,255,255,.6) inset}
  .scene-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;
    border-bottom:1px solid var(--line);padding-bottom:12px}
  .scene-yr{font-size:13px;color:#fff;background:var(--ink);border-radius:6px;padding:2px 12px;letter-spacing:1px;white-space:nowrap}
  .scene-title{font-size:20px;color:var(--ink);font-weight:700;letter-spacing:1px}
  .narr{font-size:15.5px;color:var(--text);margin:14px 0;text-align:justify}
  .narr p{margin:12px 0}
  .speak{border-left:3px solid var(--gold);padding:4px 0 4px 14px;margin:14px 0;color:var(--ink-deep)}
  .speak b{color:var(--cinnabar)}
  .aside{background:var(--paper-2);border-radius:10px;padding:12px 16px;margin:14px 0;
    font-size:13px;color:var(--ink-soft);border-left:3px solid var(--ink-soft)}
  .aside b{color:var(--ink)}

  /* 选项 */
  .opts{display:flex;flex-direction:column;gap:11px;margin-top:20px}
  .opt{border:1px solid var(--ink-soft);border-radius:10px;background:#fff;color:var(--ink);
    padding:14px 18px;font-size:15px;text-align:left;cursor:pointer;transition:.18s;font-family:inherit;
    display:flex;gap:12px;align-items:flex-start;line-height:1.65}
  .opt:hover{background:var(--paper-2);border-color:var(--ink);transform:translateX(3px)}
  .opt .mk{color:var(--cinnabar);font-weight:700;flex:none}
  .opt small{display:block;color:var(--muted);font-size:12px;margin-top:3px;font-weight:400}
  .opt.disabled{opacity:.5;cursor:not-allowed;border-style:dashed}
  .opt.disabled:hover{background:#fff;transform:none}

  /* 自由输入 */
  .freebox{margin-top:16px;border:1px dashed var(--ink-soft);border-radius:10px;padding:14px 16px;background:#fbfaf6}
  .freebox .lab{font-size:13px;color:var(--ink);margin-bottom:8px;letter-spacing:.5px}
  .freebox textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;
    padding:10px 12px;font-size:14px;font-family:inherit;color:var(--text);resize:vertical;min-height:54px}
  .freebox .frow{display:flex;justify-content:flex-end;margin-top:8px}
  .btn{background:var(--ink);color:#fff;border:none;border-radius:8px;padding:9px 22px;
    font-size:14px;letter-spacing:2px;cursor:pointer;font-family:inherit;transition:.18s}
  .btn:hover{background:var(--ink-soft)}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--ink)}
  .btn.ghost:hover{background:var(--paper-2)}

  /* 结果反馈 */
  .verdict{margin-top:6px;animation:fade .5s ease}
  .verdict .consq{font-size:15px;margin:14px 0;text-align:justify}
  .shijian{background:linear-gradient(180deg,#fbfaf6,#f1ece0);border:1px solid var(--line);
    border-left:4px solid var(--cinnabar);border-radius:10px;padding:14px 18px;margin:16px 0}
  .shijian .h{color:var(--cinnabar);font-weight:700;font-size:13px;letter-spacing:2px;margin-bottom:6px}
  .shijian .b{font-size:13.5px;color:var(--ink-deep)}
  .delta{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
  .dchip{font-size:12px;border-radius:6px;padding:3px 10px;border:1px solid var(--line);background:#fff}
  .dchip.up{color:var(--good);border-color:#bcd3c6} .dchip.up::before{content:"▲ "}
  .dchip.dn{color:var(--cinnabar);border-color:#e0c4c0} .dchip.dn::before{content:"▼ "}

  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* 史料收集侧栏 */
  .ledger{border:1px solid var(--line);background:#fbfaf6;border-radius:12px;padding:16px 20px;margin-bottom:18px}
  .ledger h3{font-size:14px;color:var(--ink);letter-spacing:2px;margin-bottom:4px;
    display:flex;align-items:center;justify-content:space-between}
  .ledger h3 span{font-size:12px;color:var(--muted);font-weight:400}
  .ledger .hint{font-size:12px;color:var(--muted);margin-bottom:10px}
  .lgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media(max-width:680px){.lgrid{grid-template-columns:1fr}}
  .lcard{border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:#fff;font-size:12px}
  .lcard .t{color:var(--ink);font-weight:600;font-size:12.5px;margin-bottom:2px}
  .lcard .d{color:var(--muted);line-height:1.5}
  .lcard.lock{background:var(--paper-2);border-style:dashed}
  .lcard.lock .t{color:var(--muted)}
  .lcard.lock .d{color:var(--line)}

  /* 结局 */
  .ending{border:1.5px solid var(--ink);border-radius:14px;overflow:hidden;margin-bottom:18px}
  .ending .top{background:linear-gradient(160deg,var(--ink-soft),var(--ink));color:#f0ece2;
    padding:26px 30px;text-align:center}
  .ending .top .rank{font-size:12px;letter-spacing:4px;opacity:.85}
  .ending .top h2{font-size:26px;color:#fff;letter-spacing:4px;margin:8px 0;border:none;padding:0}
  .ending .top .yr{font-size:13px;opacity:.8}
  .ending .body{padding:24px 30px;background:#fbfaf6}
  .ending .body p{margin:12px 0;font-size:15px;text-align:justify}
  .score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
  @media(max-width:680px){.score-grid{grid-template-columns:1fr}}
  .scell{border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center;background:#fff}
  .scell b{display:block;font-size:22px;color:var(--ink)}
  .scell span{font-size:11px;color:var(--muted)}
  .truth{background:var(--paper-2);border-radius:10px;padding:16px 18px;margin:14px 0;border-left:4px solid var(--gold)}
  .truth .h{color:var(--gold);font-weight:700;letter-spacing:2px;font-size:13px;margin-bottom:6px}
  .truth .b{font-size:14px;color:var(--ink-deep)}

  /* 场景氛围背景（水墨）*/
  .scene-bg{height:92px;border-radius:12px;margin-bottom:16px;position:relative;overflow:hidden;
    border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
  .scene-bg .bg-motto{font-size:25px;letter-spacing:14px;color:rgba(255,255,255,.94);
    font-weight:700;text-indent:14px;font-family:"Songti SC",serif;z-index:2;text-shadow:0 2px 12px rgba(0,0,0,.3)}
  .scene-bg .bg-seal{position:absolute;right:16px;top:13px;width:38px;height:38px;border:2px solid rgba(214,160,150,.9);
    color:rgba(235,200,194,.95);border-radius:5px;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;background:rgba(168,68,58,.25);z-index:2;line-height:1.15;text-align:center}
  .scene-bg::after{content:"";position:absolute;inset:0;z-index:1;
    background:radial-gradient(circle at 82% 130%,rgba(255,255,255,.13),transparent 50%),
               radial-gradient(circle at 8% -30%,rgba(255,255,255,.10),transparent 45%)}
  .th-night{background:linear-gradient(135deg,#1c2937,#34506c)}
  .th-palace{background:linear-gradient(135deg,#2c4661,#46637f)}
  .th-court{background:linear-gradient(135deg,#3d5b78,#5a7058)}
  .th-frontier{background:linear-gradient(135deg,#46555f,#8a8275)}
  .th-scorched{background:linear-gradient(135deg,#6b5142,#9c7a3c)}
  .th-storm{background:linear-gradient(135deg,#2f3d4a,#5a4750)}
  .th-doom{background:linear-gradient(135deg,#1f2d3a,#4a2f33)}
  /* 成就标签 */
  .ach{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
  .ach .a{font-size:12px;border:1px solid var(--gold);color:var(--gold);border-radius:16px;padding:4px 13px;background:#fff}
  .ach .a.neg{border-color:var(--cinnabar);color:var(--cinnabar)}

  h2{font-size:19px;color:var(--ink);border-left:4px solid var(--ink);padding-left:12px;margin-bottom:14px}
  .footer{text-align:center;color:var(--muted);font-size:12px;margin-top:30px;line-height:1.9}
  .center{text-align:center}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <span class="tag">重 生 模 拟</span>
    <h1>重生 · 崇祯十七年</h1>
    <div class="sub">一念之间，三十一年兴亡 —— 你，能救得了大明吗？</div>
  </header>

  <!-- 状态栏 -->
  <div class="hud" id="hud">
    <div class="hud-top">
      <div class="hud-yr" id="hudYr">崇祯元年 · 1628<small id="hudAge">朱由检 · 18岁</small></div>
      <div style="font-size:12px;color:var(--muted)" id="hudReign">在位：第 1 年</div>
    </div>
    <div class="stats" id="stats"></div>
  </div>

  <!-- 史料收集 -->
  <div class="ledger" id="ledger" style="display:none">
    <h3>史鉴录 <span id="lgCount">0 / 8</span></h3>
    <div class="hint">每做一个真实的历史抉择，便解锁一条史料 —— 这是你重生此世该带走的东西。</div>
    <div class="lgrid" id="lgrid"></div>
  </div>

  <!-- 主舞台 -->
  <div class="stage" id="stage"></div>

  <div class="footer">
    重生·崇祯十七年 &nbsp;·&nbsp; 一部可玩的明末史 &nbsp;·&nbsp; 所有事件、人物、后果均基于真实历史<br>
    数据结构内核：场景分支 + 变量 + 技能检定 + 自由施政 + 多结局加权裁定（PRD v4）
  </div>
</div>

<script>
/* =========================================================================
   引擎：状态 / 变量 / 技能 / 史料 / 加权结局裁定
   ========================================================================= */
const VARS = [
  {k:'国库', d:'内帑与太仓存银'},
  {k:'军心', d:'九边将士的战意'},
  {k:'民心', d:'天下百姓的归附'},
  {k:'朝局', d:'党争与君臣相得'},
  {k:'边防', d:'辽东对后金的防线'},
  {k:'皇威', d:'天子的权柄与威信'},
];
const SKILLS = {决断:55, 识人:45, 隐忍:60, 权术:40};

/* 每幕的水墨氛围与立意 */
const BG = {
  intro:{th:'night', motto:'一念醒来'},
  wei:{th:'palace', motto:'忍而后发'},
  donglin:{th:'court', motto:'党争钱袋'},
  liaodong:{th:'frontier', motto:'辽东风雪'},
  minbian:{th:'scorched', motto:'流寇四起'},
  liangxian:{th:'storm', motto:'两线之困'},
  weiju:{th:'doom', motto:'甲申之春'},
};

/* 可自由施政的关口（PRD 的「自由输入」）：玩家自拟方略，引擎读你的意图 */
const FREE = {
  wei:{ph:'如：先褒奖稳住魏忠贤，暗中逐其党羽，再一击拿下'},
  donglin:{ph:'如：整顿盐税、追缴勋贵欠赋，绝不裁驿、不加民赋'},
  minbian:{ph:'如：开仓赈灾、轻徭薄赋，剿抚并用先安人心'},
  weiju:{ph:'如：即刻护送太子南迁南京，留半壁江山再图'},
};

/* 读懂玩家自拟方略的意图 → 折算变量 + 给出朝堂反应 */
function analyzeDecree(text){
  const t = text, eff = {}, tags = [];
  const add = (k,v)=>{ eff[k]=(eff[k]||0)+v; };
  const has = (...ws)=>ws.some(w=>t.includes(w));
  if(has('赈','放粮','开仓','免赋','免税','轻徭','薄赋','减税','减赋','恤民','养民','救灾','赈济')){ add('民心',10); add('天命',6); add('国库',-8); tags.push('体恤民生'); }
  if(has('加征','加赋','加税','加饷','增税','征派','敛财','搜刮')){ add('国库',10); add('民心',-10); add('天命',-6); tags.push('加赋敛财'); }
  if(has('杀','诛','凌迟','严惩','重典','问斩','处死','下狱')){ add('皇威',6); add('朝局',-4); add('民心',-4); tags.push('严刑峻法'); }
  if(has('议和','求和','和谈','通好','互市','款议')){ add('边防',8); add('朝局',-6); tags.push('对外议和'); }
  if(has('练兵','整军','募兵','强军','修边','筑城','守边','备战')){ add('军心',8); add('边防',6); add('国库',-8); tags.push('整军经武'); }
  if(has('用贤','选贤','纳谏','举才','任能','广开言路','用人','贤臣')){ add('朝局',8); add('皇威',2); tags.push('知人善任'); }
  if(has('节俭','节用','裁冗','缩减','省银','省费')){ add('国库',8); add('皇威',2); tags.push('节用度支'); }
  if(has('剿','围剿','清剿','讨贼','平叛','镇压')){ add('军心',4); add('民心',-6); add('国库',-6); tags.push('武力清剿'); }
  if(has('抚','招安','招抚','安置','收编','安抚')){ add('民心',5); add('国库',-4); tags.push('招抚流民'); }
  if(has('南迁','南渡','迁都','退守','南幸')){ add('天命',10); tags.push('谋退江南'); S.flags.南迁=true; }
  if(Object.keys(eff).length===0){ add('皇威',2); tags.push('中庸守成'); }
  return {eff,tags};
}
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

const S = {
  国库:35, 军心:40, 民心:45, 朝局:30, 边防:35, 皇威:50,
  天命:50,            // 隐藏值：天灾、人心向背的暗流
  year:1628, age:18, reign:1,
  flags:{}, ledger:[]
};

/* 史料库：达成条件即解锁 */
const LEDGER = [
  {id:'wei',   t:'魏忠贤之死',   d:'崇祯即位仅三月便除阉党。隐忍而后发，是他一生最漂亮的一仗。'},
  {id:'yi',    t:'驿站之裁',     d:'1629年裁驿省银68万两，却把驿卒李自成逼成了流寇——省小钱，酿大祸。'},
  {id:'yuan',  t:'袁崇焕之冤',   d:'“五年复辽”落空，己巳之变后中反间计，1630年凌迟袁崇焕。自毁长城。'},
  {id:'ice',   t:'小冰期',       d:'崇祯朝连年大旱、蝗灾、鼠疫。天灾非人力可挽，却放大了所有人祸。'},
  {id:'three', t:'三饷加派',     d:'辽饷、剿饷、练饷层层加征。为剿寇而加赋，赋越重则寇越多——死循环。'},
  {id:'he',    t:'议和之祸',     d:'1642年密遣陈新甲与清议和，事泄遭言官围攻，崇祯杀陈新甲灭口。面子误国。'},
  {id:'south', t:'南迁之议',     d:'李明睿请南迁守半壁，群臣以“弃宗庙”相阻，崇祯顾虑名声而犹疑，终成绝路。'},
  {id:'end',   t:'君王死社稷',   d:'1644年三月十九，崇祯自缢煤山，遗言“勿伤百姓一人”。无道之君亡，有心无力之君亦亡。'},
];

/* =========================================================================
   剧本：场景图（PRD 的「剧情数据结构」树）
   每个 node：年份 / 标题 / 叙述 / 旁白 / 选项[{效果,史评,解锁史料,跳转}]
   ========================================================================= */
const SCENES = {

  /* ---- 序章：重生 ---- */
  intro:{
    year:1627, title:'重生 · 一念醒来', noStat:true,
    body:`<p>你本是二十一世纪的一个普通人。某个加班的深夜，你趴在桌上睡去——再睁眼，已是<b>天启七年八月</b>。</p>
      <p>烛火昏黄，殿宇森森。一群跪着的太监山呼“万岁”。你低头看自己年轻的手，慢慢想起：你成了<b>朱由检</b>，信王，年十七。你那位做木匠的皇兄天启帝刚刚驾崩，无子，遗诏传位于你。</p>
      <p>你脑中装着四百年的历史：你知道这个王朝还有<b>十七年</b>就要亡了。你知道煤山上那棵歪脖子树。你知道李自成、知道皇太极、知道一切结局。</p>
      <p>可历史的洪流近在眼前，第一道考验已经压来——司礼监秉笔太监、九千岁<b>魏忠贤</b>，权倾朝野，党羽遍布要津。他正笑眯眯地看着你这个新君。</p>`,
    aside:`你拥有的，不是金手指，而是<b>记忆</b>与<b>抉择</b>。历史能否改写，全看你这十七年怎么走。`,
    opts:[{text:'继位登基，是为崇祯。开始这一世。', mk:'承', go:'wei'}]
  },

  /* ---- 第一幕：阉党 ---- */
  wei:{
    year:1627, title:'第一幕 · 九千岁', age:17,
    body:`<p>魏忠贤的势力大到什么地步？各地为他建“生祠”，塑像比孔庙还多；满朝“阉党”自称门下走狗。你若动他，他党羽控制着东厂、锦衣卫，一个不慎便是你性命不保。</p>
      <p>你不动声色。先收下他献的厚礼，对他温言褒奖，让他放松警惕。背地里，你睡觉都把饼藏在袖中，不吃宫里送的食物——你怕被毒死。</p>`,
    speak:`<b>魏忠贤</b>：“老奴愿为皇爷肝脑涂地，朝中之事，皇爷只管安心，有老奴在……”`,
    aside:`真实历史：崇祯即位之初<b>隐忍数月</b>，不露声色，正是这一手稳住了局面。`,
    opts:[
      {text:'立即下旨抄家问罪，雷霆扫除阉党。', mk:'急', sk:'决断',
        eff:{皇威:+8,朝局:-12,军心:-4},
        consq:`你太急了。阉党盘根错节，骤然发难，东厂番子狗急跳墙，京营哗动。虽最终拿下魏忠贤，朝堂却血流成河、人人自危，元气大伤。`,
        shi:`操之过急，往往把可控的清算变成不可控的动荡。`, unlock:'wei', go:'donglin'},
      {text:'隐忍数月，先剪其羽翼，再一击致命。', mk:'忍', sk:'隐忍', rec:true,
        eff:{皇威:+12,朝局:+8,民心:+6},
        consq:`你不急。先借言官之口弹劾阉党外围，一个个调走、罢免，待魏忠贤孤立无援，才下旨贬其往凤阳守陵。魏忠贤行至途中，知大势已去，自缢身亡。<b>即位仅三月，兵不血刃，天下称快。</b>`,
        shi:`这是崇祯一生最漂亮的一役。隐忍不是软弱，是等一个一击必中的时机。`, unlock:'wei', go:'donglin'},
      {text:'继续重用魏忠贤，借其能力稳住财政与边事。', mk:'纵', sk:'权术',
        eff:{皇威:-15,朝局:-8,民心:-14,天命:-10},
        consq:`你想：阉党虽恶，办事却狠，或可借其敛财养兵。可你低估了天下人心——士林沸腾，骂你昏君，魏党更加骄横，吏治彻底败坏。你失去了最初的人望。`,
        shi:`有些恶，纵容它一时之“能用”，会吞掉你全部的合法性。`, unlock:'wei', go:'donglin'},
    ]
  },

  /* ---- 第二幕：党争与财政 ---- */
  donglin:{
    year:1629, title:'第二幕 · 朝局与钱袋', age:19,
    body:`<p>阉党既除，东林党人弹冠相庆，纷纷要求平反、起复、清算余党。可你很快发现：没了阉党这个共同的敌人，东林内部、东林与其余各派之间，党争反而更凶了。奏疏堆成山，全是互相攻讦。</p>
      <p>更要命的是<b>钱</b>。辽东的后金年年压境，军费如无底洞，太仓存银见底。有官员上奏：天下驿站靡费巨大，不如<b>裁撤驿站</b>，一年可省下六十八万两。</p>`,
    aside:`这一年起，陕西北部连年大旱。<b>小冰期</b>的寒潮正笼罩整个北半球，可此刻无人知道这意味着什么。`,
    opts:[
      {text:'裁撤驿站省军费——国库要紧，先省下这笔钱。', mk:'省', sk:'决断',
        eff:{国库:+12,民心:-12,天命:-8},
        flag:'裁驿',
        consq:`六十八万两入了库。可你不知道：被裁掉的驿卒里，有一个陕西银川驿的失业青年，叫<b>李自成</b>。失业、欠饷、又逢大旱……他和千万流民一起，走上了造反的路。`,
        shi:`省下的是六十八万两，葬送的是整座江山。小处的“精明”，有时是大处的灾难。`, unlock:'yi', go:'liaodong'},
      {text:'整顿盐税、追缴勋贵欠赋，向有钱人要钱。', mk:'清', sk:'权术', rec:true,
        eff:{国库:+8,朝局:-10,皇威:+4,民心:+6},
        consq:`你盯上了盐商和不纳赋的勋贵、宗室。钱是收上来一些，但你也因此得罪了整个既得利益集团，他们在朝中阳奉阴违，政令出不了紫禁城。你保住了民心，却更孤立。`,
        shi:`向穷人加赋易，向富人收税难——这是崇祯始终没能真正下手解决的死结。`, go:'liaodong'},
      {text:'加征“辽饷”，按田亩向全国摊派军费。', mk:'征', sk:'决断',
        eff:{国库:+15,民心:-16,天命:-12},
        flag:'三饷',
        consq:`辽饷加派，太仓暂时充盈。可这笔钱最终压在自耕农头上，本就大旱绝收的农民，被逼到卖儿卖女。日后还有“剿饷”“练饷”——<b>三饷</b>叠加，为剿寇而加赋，赋越重则反者越多。`,
        shi:`饮鸩止渴。明末财政的死循环：要钱平乱 → 加赋 → 民变更烈 → 更要钱。`, unlock:'three', go:'liaodong'},
    ]
  },

  /* ---- 第三幕：辽东与袁崇焕 ---- */
  liaodong:{
    year:1630, title:'第三幕 · 五年复辽', age:20,
    body:`<p>辽东是悬在头顶的刀。你召见名将<b>袁崇焕</b>。平台之上，袁崇焕慨然立誓：“<b>计五年，全辽可复！</b>”满朝振奋，你大喜，授他兵部尚书、督师蓟辽，要钱给钱、要权给权，连尚方宝剑都给了。</p>
      <p>可不到两年，崇祯二年冬，皇太极避开宁锦防线，<b>绕道蒙古、破长城口子，兵临北京城下</b>——史称“己巳之变”。京师戒严，舆论哗然：袁崇焕守的辽东，怎么让敌人打到了皇城根？更有流言说他通敌引敌入关。</p>`,
    speak:`<b>袁崇焕</b>千里驰援，在广渠门外与后金血战，击退敌军。可城内的猜忌，比城外的刀更冷。`,
    aside:`真实历史：皇太极用了“反间计”，故意让被俘的太监听到“袁督师与我有密约”，再放他回去。崇祯信了。`,
    opts:[
      {text:'中反间计，下狱凌迟袁崇焕，以正国法。', mk:'诛', sk:'识人',
        eff:{边防:-18,军心:-16,皇威:-6,天命:-10},
        flag:'杀袁',
        consq:`崇祯三年八月，袁崇焕被凌迟处死，京城百姓不明真相，争食其肉。你亲手杀了最能打的统帅。九边将领寒心：为国卖命，下场竟是如此？此后<b>再无人敢言“复辽”</b>，名将或死或降。`,
        shi:`“自毁长城”四字，是后世对此事的定评。多疑，是崇祯最深的病。`, unlock:'yuan', go:'minbian'},
      {text:'压住怒火与流言，先用其守城，战后再查。', mk:'查', sk:'隐忍', rec:true,
        eff:{边防:+10,军心:+8,朝局:-8,皇威:+4},
        consq:`你强忍猜忌，没有自毁长城。袁崇焕戴罪守边，辽东防线得以维系。但你顶着满朝“袁崇焕通敌”的弹劾，君臣之间裂痕已生，党争借机更烈——你赢了边防，输了一部分朝局。`,
        shi:`重生者的清醒：你知道反间计，于是没杀。历史在此，第一次被你掰动了一点。`, unlock:'yuan', go:'minbian'},
      {text:'罢其官、夺其权，贬为庶民，既不杀也不用。', mk:'弃', sk:'权术',
        eff:{边防:-10,军心:-8,朝局:+2},
        consq:`你各打五十大板，把袁崇焕一撸到底。没杀人，避免了最坏的寒心，可辽东也失去了主心骨，防线松动。朝臣看出你的犹疑，更加揣摩上意、明哲保身。`,
        shi:`折中未必稳妥。在用人上模棱两可，常常两头落空。`, go:'minbian'},
    ]
  },

  /* ---- 第四幕：民变 ---- */
  minbian:{
    year:1635, title:'第四幕 · 流寇四起', age:25,
    body:`<p>你最怕的事还是来了。陕西大旱已连续数年，赤地千里，易子而食。活不下去的流民汇成洪流——<b>高迎祥、李自成、张献忠</b>，揭竿者遍布中原。官军疲于奔命，剿不胜剿。</p>
      <p>朝中争论不休：是<b>狠剿</b>，把流寇斩尽杀绝？还是<b>招抚</b>，给条活路、招安遣散？或是<b>边剿边抚</b>，剿抚并用？而要剿，就要加饷；一加饷，又有更多人活不下去去造反……</p>`,
    aside:`真实历史：明廷在“剿”与“抚”之间反复横跳，招抚的流寇往往因官府失信或断粮而复叛。<b>根子是饥荒，不是兵不够。</b>`,
    opts:[
      {text:'开仓赈灾、轻徭薄赋，先让百姓活下去。', mk:'赈', sk:'识人', rec:true,
        eff:{国库:-14,民心:+20,天命:+12},
        consq:`你顶着“国库空虚”的压力，开仓放粮、暂免重灾区赋税。国库更紧了，可中原渐渐有了人气，流民归乡，李自成们失去了源源不断的兵源。<b>釜底抽薪，比扬汤止沸有用得多。</b>`,
        shi:`明末民变的本质是饥荒。能想到“先让人活下去”，你已比当年的崇祯高明。`, go:'liangxian'},
      {text:'倾力围剿，调重兵把流寇斩草除根。', mk:'剿', sk:'决断',
        eff:{国库:-16,军心:+6,民心:-14,天命:-8},
        flag:'重剿',
        consq:`你信“乱世用重典”。官军一度大胜，高迎祥被擒。可剿寇要钱，钱从加饷来，加饷又逼出新的流民。按下葫芦浮起瓢，李自成屡败屡起，越剿越多。`,
        shi:`只剿不抚，是在和饥荒赛跑，而饥荒永远跑得更快。`, go:'liangxian'},
      {text:'以抚为主，招安遣散，许以官职田地。', mk:'抚', sk:'权术',
        eff:{国库:-6,军心:-8,民心:+6,天命:-4},
        consq:`你主张招抚。一时间不少流寇受降，张献忠也曾假意归顺。可朝廷既无粮安置，又无信用，降而复叛者众。张献忠在谷城再反，杀官劫库，声势更大。`,
        shi:`招抚的前提是兑现承诺。一个连降兵都养不起、信不过的朝廷，抚也抚不住。`, go:'liangxian'},
    ]
  },

  /* ---- 第五幕：两线作战 ---- */
  liangxian:{
    year:1642, title:'第五幕 · 两线之困', age:32,
    body:`<p>最凶险的局面成形了：<b>关外</b>，皇太极的清军在松锦决战中全歼明军精锐，主帅洪承畴兵败降清，辽东再无野战之力；<b>关内</b>，李自成已成燎原之势，围开封、破洛阳，杀了富甲天下的福王。</p>
      <p>大明再无同时打赢两场战争的国力。兵部尚书<b>陈新甲</b>悄悄向你进言：何不<b>暗中与清议和</b>，腾出手来先平内乱？“攘外必先安内”，集中力量打一头。</p>`,
    aside:`真实历史：崇祯确实密令陈新甲议和，事情却因泄密而败露。满朝清流痛骂“议和辱国”，崇祯为保自己颜面，<b>把责任全推给陈新甲，将他下狱处死。</b>`,
    opts:[
      {text:'力排众议，秘密与清议和，集中平内乱。', mk:'和', sk:'权术', rec:true,
        eff:{边防:+10,军心:+8,朝局:-12,天命:+8},
        flag:'议和',
        consq:`你顶住“议和即卖国”的唾沫，密约暂成：清军止步关外，明军全力南顾。这一步极不光彩，却换来了喘息。你保下了陈新甲——你知道杀他毫无意义，只会让人寒心。`,
        shi:`真正的政治家算的是国运，不是名声。重生者的你，敢背这个骂名。`, unlock:'he', go:'weiju'},
      {text:'同意议和，但事泄后杀陈新甲平息物议。', mk:'弃', sk:'隐忍',
        eff:{边防:+4,朝局:-6,皇威:-10,天命:-6},
        flag:'议和',
        consq:`议和密谋走漏，言官炸了锅。你为保颜面，下旨处死奉命行事的陈新甲。物议是平了，可从此<b>再没有大臣敢替你做脏活、担风险</b>——人人只求自保。议和也就此中断。`,
        shi:`为了面子杀掉替你做事的人，是崇祯式的悲剧。从此君臣离心。`, unlock:'he', go:'weiju'},
      {text:'拒绝议和，誓与清、寇两线死战到底。', mk:'战', sk:'决断',
        eff:{国库:-16,军心:-10,边防:-8,天命:-10},
        consq:`“天子守国门，岂可议和！”你拒绝了。气节满分，国力透支。两线作战如两头放血，三饷再加，民变更炽。你赢得了清名，却把大明拖向了油尽灯枯。`,
        shi:`气节是好东西，但只有气节救不了一个财政与军力都已破产的王朝。`, go:'weiju'},
    ]
  },

  /* ---- 第六幕：危局南迁 ---- */
  weiju:{
    year:1644, title:'第六幕 · 甲申之春', age:33,
    body:`<p>崇祯十七年正月，李自成在西安称帝，国号“大顺”，挥师东进，一路州县望风而降，直扑北京。屋漏偏逢连夜雨——京师爆发<b>大鼠疫</b>，十室九空，守城兵卒病饿交加，连城墙都站不满人。</p>
      <p>翰林学士<b>李明睿</b>密奏：京师已不可守，请陛下<b>南迁</b>，退守南京。南京本是留都，有完整的六部班子，江南财赋未损，长江天险犹在——南迁，便有半壁江山可守，便有东山再起之机。</p>`,
    aside:`真实历史：崇祯其实<b>动过南迁的念头</b>，却怕担“弃宗庙、弃京师”的骂名，又指望群臣主动“替他说出口”担责任。群臣谁也不肯背锅，事情就这样拖死了。`,
    opts:[
      {text:'力排众议，即刻护送太子与朝廷南迁南京。', mk:'迁', sk:'决断', rec:true,
        eff:{皇威:-6,军心:+6,朝局:-8,天命:+15},
        flag:'南迁',
        consq:`你不再要那张脸。你知道历史上正是这一念之差，葬送了最后的生路。你顶着“天子弃京”的滔天骂名，护着太子、带着南京六部能用的班底，渡江南下。北京可以丢，<b>大明的法统不能断。</b>`,
        shi:`南渡，未必能中兴，但至少不是死局。崇祯当年最缺的，就是这一点“不要脸”的清醒。`, unlock:'south', go:'final'},
      {text:'犹豫不决，等群臣“主动”请你南迁来担责。', mk:'疑', sk:'权术',
        eff:{皇威:-10,朝局:-10,天命:-12},
        flag:'守京',
        consq:`你和历史上的崇祯一样，想南迁，又怕背锅，盼着大臣替你开口。可满朝文武谁愿担这“弃京”之责？议来议去，李自成的大军已到居庸关。<b>南迁的窗口，在犹豫里彻底关死了。</b>`,
        shi:`领导力的核心是担责。把决定的责任推给别人，最后失去的是全部。`, unlock:'south', go:'final'},
      {text:'决意死守北京，调吴三桂弃宁远入卫勤王。', mk:'守', sk:'隐忍',
        eff:{边防:-10,军心:+4,皇威:+4,天命:-6},
        flag:'守京',
        consq:`你选择天子守国门。急调辽东总兵吴三桂放弃宁远、回师勤王。可宁远到北京路途遥远，诏书下得太迟，吴三桂的兵还在路上，李自成的大顺军已经攻破了外城。`,
        shi:`死守是悲壮的选择，但当京师已是空城、援军远在天边时，悲壮往往只剩“悲”。`, go:'final'},
    ]
  },

  /* ---- 终局裁定 ---- */
  final:{ compute:true }
};

/* =========================================================================
   结局裁定：加权计算最终国运 + 关键 flag，落到 55 结局中的代表性几条
   ========================================================================= */
function judge(){
  const g = S.国库+S.军心+S.民心+S.朝局+S.边防+S.皇威 + S.天命;  // 综合国运 0~700
  const f = S.flags;
  let id;
  if(f.南迁 && g>=380) id='zhongxing';        // 南渡 + 国运高 → 中兴
  else if(f.南迁) id='nandu';                 // 南渡偏安
  else if(g>=420) id='shouzheng';            // 死守却基础雄厚 → 力保危城
  else if(g<=210) id='sucui';                // 国运崩坏 → 速亡
  else id='sheji';                            // 默认：君王死社稷（史实结局）

  const E = {
    zhongxing:{
      rank:'结局 · 上上 · 千古一帝',
      name:'重 整 河 山',
      yr:'1644 之后 · 改写的历史',
      lead:[
        `北京陷落了，但大明没有亡。`,
        `你早早南渡，江南的财赋、长江的天险、南京完整的六部班底，加上你一路攒下的民心、军心与边防底子，让南明没有重蹈党争内耗、一触即溃的覆辙。你重用能臣、轻徭薄赋、整军经武，与清隔江相持，徐徐图之。`,
        `数年之后，史书将这一段称为“崇祯南渡，再造大明”。你这个重生者，真的把那棵歪脖子树，从历史里抹掉了。`
      ],
      truth:`真实的崇祯没能做到这一切——他多疑、急躁、好面子，在每一个岔路口都选错。你证明了：明亡不是“天命已绝”，而是一连串本可避免的人祸。`
    },
    nandu:{
      rank:'结局 · 上 · 半壁江山',
      name:'南 渡 偏 安',
      yr:'1644 之后 · 划江而治',
      lead:[
        `你护着太子与法统渡过了长江。北京虽失，南京犹在，大明的旗号没有倒。`,
        `根基毕竟已被三饷、民变、辽事掏空，你无力北伐中兴，却也守住了半壁江山，没让南明像历史上那样在内斗中迅速崩塌。划江而治，总比煤山的那根白绫强。`,
      ],
      truth:`历史上崇祯因怕担“弃京”之名而错失南迁，自缢身亡；南明随后又在党争中一败涂地。你只是做对了一件事——南迁——就换来了完全不同的结局。`
    },
    shouzheng:{
      rank:'结局 · 中上 · 天子守国门',
      name:'力 保 危 城',
      yr:'1644 · 北京',
      lead:[
        `你没有南迁，选择了与社稷共存亡。但你这十七年攒下的家底足够厚：军心可用、民心未失、边军尚能一战。`,
        `吴三桂的关宁铁骑终于及时赶到，与守军内外夹击，竟在北京城下挫败了李自成的锐气，大顺军暂退。京师守住了，可大明已是强弩之末，关外的清军正虎视眈眈。这是一场惨胜，前路依旧未卜。`,
      ],
      truth:`真实历史里，吴三桂的勤王诏下得太迟，援军未到京城已破。差的，往往就是几天、一个早一点的决断。`
    },
    sheji:{
      rank:'结局 · 中 · 与史同归',
      name:'君 王 死 社 稷',
      yr:'1644 三月十九 · 煤山',
      lead:[
        `和四百年前那个真实的崇祯一样，你走到了这里。`,
        `三月十九日拂晓，李自成的大军攻破北京。你在前殿鸣钟召集百官，却无一人前来。你登上煤山，回望这座你守了十七年、终究没守住的皇城。`,
        `你在衣襟上写下最后的话：“朕凉德藐躬，上干天咎……然皆诸臣误朕。任贼分裂朕尸，<b>勿伤百姓一人</b>。”随后自缢于山亭之下。陪着你的，只有一个太监王承恩。`,
      ],
      truth:`崇祯不是商纣那样的暴君。他勤政、节俭、励精图治，却生不逢时，又性多疑、急于求成。一个有心救国却处处下错棋的人，照样亡了国——这正是历史最沉重的一课。`
    },
    sucui:{
      rank:'结局 · 下 · 速朽',
      name:'国 祚 速 崩',
      yr:'1644 之前 · 提前到来的终局',
      lead:[
        `你比真实的崇祯败得更快、更惨。`,
        `财政破产、军心尽散、民心丧尽、党争撕裂朝堂、边防形同虚设——你在一连串错误里加速了崩塌。流寇与清军两面夹击，大明像一座被蛀空的大厦，在你手里轰然倒下，连十七年都没撑到。`,
      ],
      truth:`这条线提醒你：崇祯虽亡，却也曾用尽全力拖了十七年。治国如逆水行舟，每一个轻率的决定，都在替敌人推船。`
    }
  };
  return E[id];
}

/* =========================================================================
   渲染
   ========================================================================= */
const stage = document.getElementById('stage');
const hud = document.getElementById('hud');
const ledgerEl = document.getElementById('ledger');

function clamp(n){return Math.max(0,Math.min(100,n));}

function renderHUD(){
  document.getElementById('hudYr').innerHTML =
    `崇祯${S.reign>1?(cn(S.reign)+'年'):'元年'} · ${S.year}<small>朱由检 · ${S.age}岁</small>`;
  document.getElementById('hudReign').textContent = `在位：第 ${S.reign} 年`;
  const box = document.getElementById('stats');
  box.innerHTML = VARS.map(v=>{
    const val=S[v.k], cls = val<=25?'low':(val>=70?'hi':'');
    return `<div class="stat" title="${v.d}">
      <div class="lb"><b>${v.k}</b><span>${val}</span></div>
      <div class="bar ${cls}"><i style="width:${val}%"></i></div></div>`;
  }).join('');
}
function cn(n){return['零','一','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五','十六','十七'][n]||n;}

function renderLedger(){
  ledgerEl.style.display='block';
  document.getElementById('lgCount').textContent = `${S.ledger.length} / ${LEDGER.length}`;
  document.getElementById('lgrid').innerHTML = LEDGER.map(l=>{
    const got = S.ledger.includes(l.id);
    return `<div class="lcard ${got?'':'lock'}">
      <div class="t">${got?l.t:'？？？'}</div>
      <div class="d">${got?l.d:'尚未解锁 —— 走到那一步，便知。'}</div></div>`;
  }).join('');
}

function unlock(id){ if(id && !S.ledger.includes(id)) S.ledger.push(id); }

function applyEff(eff){
  const log=[];
  for(const k in eff){
    if(k==='天命'){ S.天命=clamp(S.天命+eff[k]); continue; }
    const before=S[k]; S[k]=clamp(S[k]+eff[k]);
    const d=S[k]-before;
    if(d!==0) log.push({k,d});
  }
  return log;
}

let busy=false;
function show(id){
  const sc = SCENES[id];
  if(sc.compute){ return renderEnding(); }
  // 推进年份/年龄
  if(sc.year){ S.year=sc.year; S.reign=Math.max(1,sc.year-1627); }
  if(sc.age){ S.age=sc.age; }

  if(!sc.noStat){ hud.classList.add('show'); renderHUD(); renderLedger(); }

  const bg = BG[id];
  let html = bg?`<div class="scene-bg th-${bg.th}"><div class="bg-seal">崇<br>祯</div><div class="bg-motto">${bg.motto}</div></div>`:'';
  html += `<div class="scene-head">
      <span class="scene-yr">${sc.year||1627}</span>
      <span class="scene-title">${sc.title}</span></div>
      <div class="narr">${sc.body}</div>`;
  if(sc.speak) html += `<div class="speak">${sc.speak}</div>`;
  if(sc.aside) html += `<div class="aside">史 ｜ ${sc.aside}</div>`;

  html += `<div class="opts" id="opts">`;
  sc.opts.forEach((o,i)=>{
    const skTxt = o.sk?`<small>主导 · ${o.sk}${o.rec?' ｜ 史家多以为此乃上策':''}</small>`:'';
    html += `<button class="opt" data-i="${i}">
      <span class="mk">${o.mk||'选'}</span>
      <span>${o.text}${skTxt}</span></button>`;
  });
  html += `</div>`;

  const fr = FREE[id];
  if(fr){
    html += `<div class="freebox">
      <div class="lab">御笔亲批 · 或<b>不选以上</b>，自拟一道方略 —— 看你怎么治这天下</div>
      <textarea id="decree" placeholder="${fr.ph}"></textarea>
      <div class="frow"><button class="btn" id="decreeBtn">朱批下旨 →</button></div></div>`;
  }

  stage.innerHTML = html;
  stage.scrollIntoView({behavior:'smooth',block:'start'});
  busy=false;
  document.querySelectorAll('#opts .opt').forEach(b=>{
    b.onclick=()=>{ if(busy)return; busy=true; choose(sc, +b.dataset.i); };
  });
  const db = document.getElementById('decreeBtn');
  if(db) db.onclick=()=>{
    if(busy) return;
    const v=(document.getElementById('decree').value||'').trim();
    if(!v){ document.getElementById('decree').focus(); return; }
    busy=true; freeChoose(sc, v);
  };
}

function freeChoose(sc, text){
  document.querySelectorAll('#opts .opt').forEach(b=>{ b.classList.add('disabled'); b.onclick=null; });
  const ta=document.getElementById('decree'); if(ta) ta.disabled=true;
  const db=document.getElementById('decreeBtn'); if(db){ db.disabled=true; db.textContent='已下旨'; db.style.opacity=.6; }
  const {eff,tags} = analyzeDecree(text);
  const log = applyEff(eff); renderHUD(); renderLedger();
  const go = sc.opts[0].go;
  const deltas = log.map(d=>`<span class="dchip ${d.d>0?'up':'dn'}">${d.k} ${d.d>0?'+':''}${d.d}</span>`).join('');
  const v=document.createElement('div'); v.className='verdict';
  v.innerHTML = `
    <div class="consq narr">你提朱笔，于奏疏上批下：「${escapeHtml(text)}」。<br>司礼监依旨拟诏，廷议先是哗然，继而默然 —— 朝野读出了你的心思：<b>${tags.join('、')}</b>，自此施行天下。</div>
    ${deltas?`<div class="delta">${deltas}</div>`:''}
    <div class="shijian"><div class="h">史 鉴</div><div class="b">为政之道，全在你一念之间。你亲笔写下的每一道旨意，都在悄悄改写国运的走向 —— 这，才是真正的“重生”。</div></div>
    <div class="center" style="margin-top:18px">
      <button class="btn" id="nextBtn">继续 · ${nextLabel(go)} →</button>
    </div>`;
  stage.appendChild(v);
  v.scrollIntoView({behavior:'smooth',block:'end'});
  document.getElementById('nextBtn').onclick=()=>{ busy=false; show(go); };
}

function choose(sc, i){
  const o = sc.opts[i];
  // 失能其他选项
  document.querySelectorAll('#opts .opt').forEach((b,idx)=>{
    b.classList.add('disabled'); b.onclick=null;
    if(idx===i){ b.classList.remove('disabled'); b.style.borderColor='var(--ink)'; b.style.background='var(--paper-2)'; }
  });
  if(o.flag) S.flags[o.flag]=true;
  if(o.unlock) unlock(o.unlock);
  const log = o.eff?applyEff(o.eff):[];
  renderHUD(); renderLedger();

  const deltas = log.map(d=>`<span class="dchip ${d.d>0?'up':'dn'}">${d.k} ${d.d>0?'+':''}${d.d}</span>`).join('');
  const v = document.createElement('div');
  v.className='verdict';
  v.innerHTML = `
    <div class="consq narr">${o.consq||''}</div>
    ${deltas?`<div class="delta">${deltas}</div>`:''}
    ${o.shi?`<div class="shijian"><div class="h">史 鉴</div><div class="b">${o.shi}</div></div>`:''}
    <div class="center" style="margin-top:18px">
      <button class="btn" id="nextBtn">继续 · ${nextLabel(o.go)} →</button>
    </div>`;
  stage.appendChild(v);
  v.scrollIntoView({behavior:'smooth',block:'end'});
  document.getElementById('nextBtn').onclick=()=>{ busy=false; show(o.go); };
}
function nextLabel(go){
  const map={donglin:'朝局',liaodong:'辽东',minbian:'平乱',liangxian:'抉择',weiju:'危局',final:'裁定终局'};
  return map[go]||'前路';
}

/* ---- 终局 ---- */
function renderEnding(){
  const e = judge();
  unlock('end'); if(S.flags.南迁) unlock('south');
  renderHUD(); renderLedger();
  const guoyun = S.国库+S.军心+S.民心+S.朝局+S.边防+S.皇威+S.天命;
  const grade = guoyun>=380?'上':guoyun>=290?'中':'下';
  const f=S.flags, ach=[];
  if(!f.杀袁) ach.push(['留袁崇焕 · 未中反间计',0]); else ach.push(['凌迟袁崇焕 · 自毁长城',1]);
  if(f.南迁) ach.push(['天子南渡 · 敢背骂名',0]);
  if(f.议和) ach.push(['务实议和 · 攘外安内',0]);
  if(!f.裁驿) ach.push(['未裁驿站 · 不曾逼反驿卒',0]); else ach.push(['裁撤驿站 · 一念酿大祸',1]);
  if(f.三饷) ach.push(['三饷加派 · 饮鸩止渴',1]);
  if(f.守京) ach.push(['天子守国门',0]);
  if(S.民心>=70) ach.push(['民心所向',0]);
  if(S.朝局>=65) ach.push(['君臣相得',0]);
  if(S.国库<=15) ach.push(['国库枯竭',1]);
  if(S.边防>=65) ach.push(['辽东未失',0]);
  const achHtml = `<div class="ach">${ach.map(a=>`<span class="a ${a[1]?'neg':''}">${a[0]}</span>`).join('')}</div>`;
  let html = `<div class="ending">
    <div class="top">
      <div class="rank">${e.rank}</div>
      <h2>${e.name}</h2>
      <div class="yr">${e.yr}</div>
    </div>
    <div class="body">
      ${e.lead.map(p=>`<p>${p}</p>`).join('')}
      <div class="score-grid">
        <div class="scell"><b>${guoyun}</b><span>最终国运（含天命）</span></div>
        <div class="scell"><b>${grade}</b><span>十七年 综合评级</span></div>
        <div class="scell"><b>${S.ledger.length}/${LEDGER.length}</b><span>史鉴 收录</span></div>
      </div>
      <div class="truth"><div class="h">历 史 真 相</div><div class="b">${e.truth}</div></div>
      <div style="font-size:13px;color:var(--ink);font-weight:600;margin-top:14px;letter-spacing:1px">这一世，史书记下你做过的事：</div>
      ${achHtml}
      <p style="color:var(--muted);font-size:13.5px;margin-top:16px">
        你重生的这一世，在六个关口替崇祯重做了选择：阉党、钱袋、袁崇焕、流寇、议和、南迁。
        每一个选择都不是对错那么简单——它是国库与民心的拉扯，是气节与生路的两难。
        这，就是身在局中的崇祯，真正面对的世界。</p>
    </div></div>
    <div class="center">
      <button class="btn ghost" onclick="location.reload()">再 活 一 世</button>
    </div>`;
  stage.innerHTML = html;
  stage.scrollIntoView({behavior:'smooth',block:'start'});
}

/* ---- 启动 ---- */
show('intro');
</script>
</body>
</html>
