<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>尘世浮生：马斯克人生分支模拟</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <section id="startScreen" class="start-screen">
      <div class="start-art"></div>
      <div class="start-copy">
        <p class="eyebrow">CHENSHI LIFE · AGENT GENERATED GAME</p>
        <h1>尘世浮生：马斯克人生分支模拟</h1>
        <p class="lead">从斯坦福报到处，到 Zip2 控股权、PayPal 内耗、2008 年双线梭哈。你将用 16 次选择体验控制权、资本、风险与长期主义之间的代价。</p>
        <div class="start-actions">
          <button id="startBtn" class="primary">开始模拟</button>
          <button id="continueBtn" class="ghost">继续上次</button>
        </div>
      </div>
      <div class="start-panel">
        <span>预计时长</span><strong>15 分钟</strong>
        <span>核心机制</span><strong>选择分支 / 状态数值 / 结局复盘</strong>
        <span>教育主题</span><strong>风险、控制权、团队信任、资源配置</strong>
      </div>
    </section>

    <section id="gameScreen" class="game-screen hidden">
      <header class="topbar">
        <div>
          <p class="eyebrow">LIFELINE NODE</p>
          <h2 id="nodeTitle">节点标题</h2>
        </div>
        <div class="top-actions">
          <button id="restartBtn" class="icon-btn" title="重新开始">↻</button>
          <button id="muteBtn" class="icon-btn" title="氛围音开关">◐</button>
        </div>
      </header>

      <section class="hero-stage">
        <img id="sceneImg" src="assets/opening.png" alt="剧情画面" />
        <div class="stage-vignette"></div>
        <div class="node-chip" id="chapterChip">开局</div>
        <div class="story-card">
          <div class="story-scroll" id="storyText"></div>
        </div>
      </section>

      <section class="choice-zone">
        <article class="choice-card" id="choiceA">
          <img id="choiceAImg" src="assets/opening.png" alt="选项 A 预览" />
          <div class="choice-body">
            <span class="choice-kicker">选择 A</span>
            <h3 id="choiceATitle"></h3>
            <p id="choiceADesc"></p>
            <div class="delta" id="choiceADelta"></div>
          </div>
        </article>
        <article class="choice-card" id="choiceB">
          <img id="choiceBImg" src="assets/opening.png" alt="选项 B 预览" />
          <div class="choice-body">
            <span class="choice-kicker">选择 B</span>
            <h3 id="choiceBTitle"></h3>
            <p id="choiceBDesc"></p>
            <div class="delta" id="choiceBDelta"></div>
          </div>
        </article>
      </section>

      <section class="command-row">
        <input id="freeInput" placeholder="也可以输入你的行动，例如：先说服团队再融资" />
        <button id="freeBtn">记录行动</button>
      </section>

      <aside class="side-panel">
        <div class="meter-block">
          <div class="meter-head"><span>控制权</span><b id="mControl">50</b></div><div class="meter"><i id="barControl"></i></div>
          <div class="meter-head"><span>资本稳健</span><b id="mCapital">50</b></div><div class="meter"><i id="barCapital"></i></div>
          <div class="meter-head"><span>技术执念</span><b id="mTech">50</b></div><div class="meter"><i id="barTech"></i></div>
          <div class="meter-head"><span>团队信任</span><b id="mTrust">50</b></div><div class="meter"><i id="barTrust"></i></div>
          <div class="meter-head"><span>风险暴露</span><b id="mRisk">50</b></div><div class="meter risk"><i id="barRisk"></i></div>
        </div>
        <div class="map-block">
          <h3>人生分支地图</h3>
          <div id="branchMap" class="branch-map"></div>
        </div>
        <div class="history-block">
          <h3>选择历史</h3>
          <ol id="historyList"></ol>
        </div>
      </aside>

      <section id="lessonToast" class="lesson-toast hidden"></section>
    </section>

    <section id="endingScreen" class="ending-screen hidden">
      <img id="endingImg" src="assets/ending-mars.png" alt="结局画面" />
      <div class="ending-overlay"></div>
      <div id="endingContent" class="ending-content">
        <p class="eyebrow">SIMULATION RESULT</p>
        <h2 id="endingTitle"></h2>
        <p id="endingSummary"></p>
        <div id="endingStats" class="ending-stats"></div>
        <div class="ending-review">
          <h3>教育复盘</h3>
          <p id="endingLesson"></p>
        </div>
        <div class="ending-actions">
          <button id="playAgainBtn" class="primary">再走一条人生线</button>
          <button id="exportBtn" class="ghost">导出选择摘要</button>
        </div>
      </div>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
