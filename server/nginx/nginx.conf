# 尘世浮生 · 生产网关
# 职责:静态资源+缓存、API 反代与限流、WS 升级、产物分发。
# 以非 root 运行(nginxinc/nginx-unprivileged 镜像,监听 8080)。
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 4096; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 2m;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # 限流:按客户端 IP。API 30r/s 突发 60;登录注册更紧的限流在应用层。
  limit_req_zone $binary_remote_addr zone=api:16m rate=30r/s;
  limit_conn_zone $binary_remote_addr zone=perip:16m;

  upstream api_up   { server api:8081;    keepalive 32; }
  upstream game_up  { server chenshi:8080; keepalive 16; }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  server {
    listen 8080;
    limit_conn perip 64;

    # 平台 API(账号/存档/排行/生成任务)
    location /v1/ {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://api_up;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # SSE:关缓冲
      proxy_buffering off;
      proxy_read_timeout 3600s;
    }

    # 生成产物(worker 写入共享卷,nginx 直接静态分发,长缓存)
    location /assets/ {
      alias /data/assets/;
      expires 30d;
      add_header Cache-Control "public, immutable";
    }

    # 既有游戏服务(lite-server):前端 + /api/invoke + /ws
    location /ws {
      proxy_pass http://game_up;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
    }
    location / {
      limit_req zone=api burst=120 nodelay;
      proxy_pass http://game_up;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
      proxy_read_timeout 600s;
    }
  }
}
