# 尘世浮生 · 生产编排
#   cp .env.prod.example .env.prod && 填好密钥
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#   水平扩容: ... up -d --scale api=3 --scale worker=2
#
# 安全基线:所有容器非 root、no-new-privileges、只读根文件系统(可写处
# 全部显式 tmpfs/卷)、内网互通不暴露宿主端口(只有 gateway 的 80)。
name: chenshi-prod

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  gateway:
    <<: *hardening
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports:
      - "80:8080"
    volumes:
      - ./server/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - assets:/data/assets:ro
    read_only: true
    tmpfs: [/tmp]
    depends_on: [api, chenshi]
    deploy:
      resources: { limits: { cpus: "1", memory: 256M } }

  # 既有游戏服务(前端 + chat/生图代理),保持原契约
  chenshi:
    <<: *hardening
    build:
      context: .
    image: chenshi-fushenglu:latest
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      POLARIS_AUTH_TOKEN: ${POLARIS_AUTH_TOKEN:-}
      IMAGE_API_KEY: ${IMAGE_API_KEY:-}
    read_only: true
    tmpfs: [/tmp]
    deploy:
      resources: { limits: { cpus: "2", memory: 512M } }

  api:
    <<: *hardening
    build:
      context: ./server
      dockerfile: Dockerfile.api
      args: { NPM_REGISTRY: "${NPM_REGISTRY:-https://registry.npmmirror.com}" }
    image: chenshi-api:latest
    environment: &apienv
      DATABASE_URL: postgres://chenshi:${POSTGRES_PASSWORD}@postgres:5432/chenshi
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      MAX_ACTIVE_JOBS_PER_USER: ${MAX_ACTIVE_JOBS_PER_USER:-2}
      DAILY_JOB_QUOTA: ${DAILY_JOB_QUOTA:-50}
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    deploy:
      resources: { limits: { cpus: "2", memory: 512M } }

  # 一次性迁移(api/worker 都等它成功后再起)
  migrate:
    build:
      context: ./server
      dockerfile: Dockerfile.api
      args: { NPM_REGISTRY: "${NPM_REGISTRY:-https://registry.npmmirror.com}" }
    image: chenshi-api:latest
    command: ["node", "src/migrate.mjs"]
    environment: *apienv
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  worker:
    <<: *hardening
    build:
      context: ./server
      dockerfile: Dockerfile.worker
      args: { NPM_REGISTRY: "${NPM_REGISTRY:-https://registry.npmmirror.com}" }
    image: chenshi-worker:latest
    environment:
      DATABASE_URL: postgres://chenshi:${POSTGRES_PASSWORD}@postgres:5432/chenshi
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      SCRIPT_TIMEOUT_SECS: ${SCRIPT_TIMEOUT_SECS:-600}
      IMAGE_TIMEOUT_SECS: ${IMAGE_TIMEOUT_SECS:-300}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
    read_only: true
    # 任务沙箱工作区:tmpfs,断电即清,写不出容器
    tmpfs:
      - /tmp
      - /work/jobs:size=1g,mode=1777
    volumes:
      - assets:/data/assets
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    deploy:
      resources: { limits: { cpus: "4", memory: 2G } }

  postgres:
    <<: *hardening
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chenshi
      POSTGRES_USER: chenshi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chenshi -d chenshi"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources: { limits: { cpus: "2", memory: 1G } }

  redis:
    <<: *hardening
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources: { limits: { cpus: "1", memory: 384M } }

volumes:
  pgdata:
  redisdata:
  assets:
